# If TRUE then allow the user to upload their own algorithm files to view
allow_file_uploads: TRUE

# The initial algorithm file to load automatically by default on startup
# initial_algorithm_file: data/models/htnport-reduced/htnport-reduced.yaml
# initial_algorithm_file: data/models/htnport-full/htnport-full.yaml

# The initial algorithm to load, must match a key in the algorithms section
# If initial_algorithm_file is set then this is ignored
initial_algorithm_id: htnport-reduced

# Algorithms to show in the "Preloaded Algorithms" dropdown
algorithms:
  htnport-full:
    title: "HTNPoRT Full Model"
    file: data/models/htnport-full/htnport-full.yaml
  htnport-reduced:
    title: "HTNPoRT Reduced Model"
    file: data/models/htnport-reduced/htnport-reduced.yaml
